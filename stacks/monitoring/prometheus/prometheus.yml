global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

# Prometheus receives application OpenTelemetry metrics from Alloy over its
# remote-write receiver. These jobs additionally monitor the stack itself.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      # pi-lens-ignore: YAML
      - targets: ["tempo:3200"]
