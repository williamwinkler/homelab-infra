stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs: {}
    span_metrics:
      # Match the resource labels on application OTLP metrics. Keep the native
      # `service` intrinsic dimension too: Grafana's service map relies on it.
      dimensions: [service.name, deployment.environment]
  registry:
    external_labels:
      cluster: homelab

# Configuring the generator above does not activate its processors.
# These derive sampled-span RED metrics and service dependencies, not a second
# copy of application counters. Application metrics remain the SLO source.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
