stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  # TraceQL metrics/Drilldown need a trace WAL separate from Prometheus' WAL.
  # Both live on the existing persistent Tempo volume.
  traces_storage:
    path: /var/tempo/generator/traces
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    local_blocks:
      # Drilldown also queries client/internal spans, not only server spans.
      filter_server_spans: false
      # Persist metrics blocks so queries work beyond the recent-data window.
      flush_to_storage: true
    service_graphs: {}
    span_metrics:
      # Match the resource labels on application OTLP metrics. Keep the native
      # `service` intrinsic dimension too: Grafana's service map relies on it.
      dimensions: [service.name, deployment.environment]
  registry:
    external_labels:
      cluster: homelab

# Configuring the generator above does not activate its processors.
# Span metrics/service graphs derive sampled-span RED/dependency metrics;
# local-blocks serves TraceQL metrics used by Grafana Traces Drilldown.
# Application counters remain the SLO source.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
