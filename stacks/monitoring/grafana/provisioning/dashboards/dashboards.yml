apiVersion: 1
providers:
  - name: homelab
    orgId: 1
    folder: Platform
    folderUid: platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards

  - name: tikkit
    orgId: 1
    folder: TIKKIT
    folderUid: tikkit
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/tikkit
