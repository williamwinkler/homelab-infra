apiVersion: 1
prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        # Alloy's OTLP conversion and Tempo's generator use different keys.
        - name: trace_id
          datasourceUid: tempo
        - name: traceID
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '(?:trace_?id|trace)[=": ]+([a-f0-9]{32})'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        # Trace-ID filtering is exact; omitting environment preserves links to
        # historical stdout logs written before environment labels were added.
        tags: [{ key: service.name, value: service_name }]
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - { key: service.name, value: service_name }
          - { key: deployment.environment, value: deployment_environment }
        queries:
          - name: Server request rate (sampled traces)
            query: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags,span_kind="SPAN_KIND_SERVER"}[5m]))'
          - name: Server p95 latency in ms (sampled traces)
            query: '1000 * histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags,span_kind="SPAN_KIND_SERVER"}[5m])))'
          - name: Server error rate (sampled traces)
            query: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags,span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m]))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
